{% extends "global/base.html" %}

{% block title %}Listado de Cursos{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color: var(--title-color);">Cursos</h2>
        <div>
            <a href="/create" class="btn btn-courses btn-action me-2">
                <i class="bi bi-plus-circle me-1"></i> Añadir Curso
            </a>
            {% if data %}
            <form action="/courses/delete-all" method="POST" class="d-inline" onsubmit="return confirmDeleteAllCourses()">
                <button type="submit" class="btn btn-danger btn-action">
                    <i class="bi bi-trash"></i> Eliminar Todos
                </button>
            </form>
            {% endif %}
        </div>
    </div>
    <div class="row g-4">
        {% for item in data %}
        <div class="col-md-4">
            <div class="card card-action h-100 shadow-sm d-flex flex-column">
                <div class="card-body d-flex flex-column">
                    <div class="mb-2">
                        <span class="badge bg-light-blue text-dark mb-2">#{{ item.id }}</span>
                        <h5 class="card-title fw-bold mb-1" style="color: var(--title-color);">{{ item.name }}</h5>
                        <div class="text-muted mb-2"><i class="bi bi-hash"></i> Codigo: {{ item.code }}</div>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0 p-3 pt-0 mt-auto">
                    <a href="/courses/{{ item.id }}" class="btn btn-primary btn-sm w-100 d-block mx-auto">
                        <i class="bi bi-eye"></i> Ver
                    </a>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12">
            <div class="alert alert-info text-center">No hay cursos registrados.</div>
        </div>
        {% endfor %}
    </div>
</div>
<script>
function confirmDeleteAllCourses() {
    if (confirm('¿Estás seguro de que quieres eliminar TODOS los cursos?')) {
        return confirm('Esta acción NO se puede deshacer. ¿Confirmas definitivamente que quieres eliminar todos los cursos?');
    }
    return false;
}
</script>

{% endblock %}
