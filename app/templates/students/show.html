{% extends "global/base.html" %}

{% block title %}Instancia del Curso{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Estudiante #{{ data.id }}</h2>
    <p><strong>Nombre:</strong> {{ data.name }}</p>
    <p><strong>Email:</strong> {{ data.email }}</p>
    <p><strong>Fecha de admisión:</strong> {{ data.admission_date }}</p>

    <a href="/students" class="btn btn-primary">Volver</a>
    <a href="/students/{{ data.id }}/edit" class="btn btn-warning">Editar</a>
    <form action="/students/{{ data.id }}/delete" method="POST" style="display:inline;">
        <button type="submit" class="btn btn-danger" onclick="return confirm('¿Eliminar este estudiante?')">Eliminar</button>
    </form>
    <form action="/reporte/resumen-estudiante/{{ data.id }}" method="POST" style="display:inline;">
        <button type="submit" class="btn btn-info">Descargar resumen académico</button>
    </form>
</div>
{% endblock %}
