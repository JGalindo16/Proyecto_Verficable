<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema Académico{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS (puedes ajustar la versión si ya tienes otra) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 220px;
            background: #212529;
            color: #fff;
            min-height: 100vh;
        }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 1rem;
        }
        .sidebar a.active, .sidebar a:hover {
            background: #343a40;
        }
        .main-content {
            flex: 1;
            padding: 2rem;
            background: #f8f9fa;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="sidebar d-flex flex-column">
        <a class="navbar-brand" href="/">Sistema Académico</a>
        <a class="nav-link {% if request.path == '/courses' %}active{% endif %}" href="/courses">Cursos</a>
        <a class="nav-link {% if request.path == '/professors' %}active{% endif %}" href="/professors">Profesores</a>
        <a class="nav-link {% if request.path == '/students' %}active{% endif %}" href="/students">Estudiantes</a>
    </nav>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
