{% extends "global/base.html" %}

{% block title %}Instancia del Curso{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Profesor #{{ data.id }}</h2>

    <p><strong>Nombre:</strong> {{ data.name }}</p>
    <p><strong>Email:</strong> {{ data.email }}</p>

    <a href="/professors" class="btn btn-primary">Volver</a>
    <a href="/professors/{{ data.id }}/edit" class="btn btn-warning">Editar</a>

    <form action="/professors/{{ data.id }}/delete" method="POST" style="display:inline;">
        <button type="submit" class="btn btn-danger" onclick="return confirm('¿Eliminar este profesor?')">Eliminar</button>
    </form>
</div>
{% endblock %}
