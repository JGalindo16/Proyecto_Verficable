{% extends "global/base.html" %}

{% block title %}Profesor #{{ data.id }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card card-action p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h3 class="fw-bold mb-0" style="color: var(--title-color);">Profesor #{{ data.id }}</h3>
            <span class="badge bg-light-blue text-dark fs-6">{{ data.name }}</span>
        </div>
        <h5 class="mb-2"><strong>Nombre:</strong> {{ data.name }}</h5>
        <h5 class="mb-2"><strong>Email:</strong> {{ data.email }}</h5>
        <div class="d-flex gap-2 mt-3">
            <a href="/professors" class="btn btn-courses btn-action flex-fill">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
            <a href="/professors/{{ data.id }}/edit" class="btn btn-warning btn-action flex-fill">
                <i class="bi bi-pencil"></i> Editar
            </a>
            <form action="/professors/{{ data.id }}/delete" method="POST" style="display:inline;" class="flex-fill">
                <button type="submit" class="btn btn-danger btn-action w-100" onclick="return confirm('¿Eliminar este profesor?')">
                    <i class="bi bi-trash"></i> Eliminar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
