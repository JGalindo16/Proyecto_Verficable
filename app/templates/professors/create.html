{% extends "global/base.html" %}

{% block title %}Crear Profesor{% endblock %}

{% block content %}
    <h2>Crear Profesor</h2>
    <form action="/professors" method="POST">
        <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" name="name" id="name" class="form-control" value="{{ form.name }}">
        </div>
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" name="email" id="email" class="form-control" value="{{ form.email }}">
        </div>
        {% if error %}
            <div class="alert alert-danger mt-2">{{ error }}</div>
        {% endif %}
        <button type="submit" class="btn btn-primary mt-3">Crear</button>
        <a href="/professors" class="btn btn-secondary mt-3">Cancelar</a>
    </form>
{% endblock %}
